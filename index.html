<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Janvi Bhardwaj | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --border-color: #30363d;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --soft-accent: #38bdf8;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.65;
            padding: 0 1.5rem 3rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Top Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .nav-logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        /* Ambient Glows & Figures */
        .ambient-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -2;
            pointer-events: none;
        }

        .glow-1 { top: -50px; left: -100px; }
        .glow-2 { bottom: 10%; right: -100px; }

        .shape {
            position: fixed;
            border: 1px solid rgba(16, 185, 129, 0.2);
            z-index: -1;
            pointer-events: none;
            animation: float 12s infinite ease-in-out;
        }

        .shape-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: 20%;
            right: 5%;
        }

        .shape-square {
            width: 60px;
            height: 60px;
            bottom: 25%;
            left: 4%;
            transform: rotate(45deg);
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(10deg); }
        }

        /* Hero Header Section */
        header {
            margin-bottom: 4rem;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.1;
            font-weight: 700;
        }

        .hero-description {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin-bottom: 2rem;
        }

        .hero-description span {
            color: var(--text-primary);
            font-weight: 600;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.25rem;
            background-color: var(--accent-color);
            color: #0d1117;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.25rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-1px);
        }

        section {
            margin-bottom: 3.5rem;
        }

        h2 {
            font-size: 1.4rem;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 0.6rem;
            line-height: 1.2;
            border-radius: 2px;
            font-weight: 700;
        }

        .subsection-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Cards & Grids */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .info-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .info-card:hover {
            transform: translateY(-2px);
            border-color: #484f58;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .info-card h3 {
            font-size: 1.15rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .badge-status {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            background-color: rgba(234, 179, 8, 0.1);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.2);
            font-weight: 600;
        }

        .badge-role {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-weight: 600;
        }

        .info-card p {
            margin-bottom: 0.8rem;
        }

        /* Skills Layout */
        .skills-group {
            margin-bottom: 1.5rem;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            list-style: none;
        }

        .skill-tag {
            background-color: var(--card-bg);
            color: var(--text-primary);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
            font-weight: 500;
            transition: border-color 0.2s ease;
        }

        .skill-tag:hover {
            border-color: var(--accent-color);
        }

        .skill-tag.soft {
            border-color: rgba(56, 189, 248, 0.3);
            color: var(--soft-accent);
        }

        .skill-tag.soft:hover {
            border-color: var(--soft-accent);
        }

        .project-links {
            display: flex;
            gap: 1.25rem;
            margin-top: 0.8rem;
        }

        .project-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            transition: color 0.2s ease;
        }

        .project-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body { padding: 0 1rem 2rem 1rem; }
            h1 { font-size: 2.2rem; }
            .nav-links { display: none; }
        }
    </style>
